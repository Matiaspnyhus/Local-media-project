name: checks

# Linux runs on every change. Windows and macOS run on release tags, on
# request, when the commit message contains [all-os], and on every change
# once the repository is public (where those machines are free).
on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a branch cancels the run of the push before it, except a
# run that publishes a version (see the plan job): that one finishes.
concurrency:
  group: checks-${{ github.ref }}-${{ contains(github.event.head_commit.message, '[release v') && github.sha || 'latest' }}
  cancel-in-progress: true

env:
  ALL_OS: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[all-os]') || github.event.repository.visibility == 'public' }}

jobs:
  # Decides whether this run publishes a version, and stamps the programs
  # with it.
  #
  # A version is published in one of two ways:
  #   - a version tag (v1.2.3) appears, pushed or made with a release on
  #     GitHub's page: the tagged commit is tested and published;
  #   - the newest commit pushed to a branch says [release v1.2.3] in its
  #     message: that commit is tested on every system and, if everything
  #     passes, published under that version (the release step makes the
  #     tag). This exists because some sessions that work on the project
  #     may push to their branch but not push tags. Only the newest commit
  #     can be published this way: GitHub does not let checks tag an older
  #     commit whose checks file differs from the one that is running.
  # Either way the commit must hold docs/release-notes/<version>.md and must
  # not hold packaging/NOT-FOR-RELEASE.txt. A version that exists already is
  # never published again. The rules are in packaging/release-plan.sh.
  plan:
    runs-on: ubuntu-latest
    outputs:
      all_os: ${{ steps.v.outputs.all_os }}
      public: ${{ steps.v.outputs.public }}
      sha: ${{ steps.r.outputs.sha }}
      version: ${{ steps.r.outputs.version }}
      release: ${{ steps.r.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          echo "all_os=${ALL_OS}" >> "$GITHUB_OUTPUT"
          echo "public=${{ github.event.repository.visibility == 'public' }}" >> "$GITHUB_OUTPUT"
      - id: r
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: bash packaging/release-plan.sh >> "$GITHUB_OUTPUT"

  # Measures how fast the test machine converts pictures with the pinned
  # converter (see packaging/speed-probe.sh). Only on request: put
  # [speed-probe] in a commit message.
  speed-probe:
    if: contains(github.event.head_commit.message, '[speed-probe]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the pinned converter
        run: |
          set -euo pipefail
          . packaging/ffmpeg.env
          curl -sSL --retry 3 -o ffmpeg-linux64.tar.xz "$FFMPEG_LINUX64_URL"
          echo "$FFMPEG_LINUX64_SHA256  ffmpeg-linux64.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          tar -xJf ffmpeg-linux64.tar.xz -C "$RUNNER_TEMP/ffmpeg"
      - name: Measure
        run: bash packaging/speed-probe.sh "$RUNNER_TEMP/ffmpeg/ffmpeg" "$RUNNER_TEMP/probe" 20

  linux:
    needs: plan
    runs-on: ubuntu-latest
    env:
      LM_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the web app
        run: cd web && npm ci --no-audit --no-fund && npm run build
      - name: Fetch the pinned converter, the same build that is shipped
        run: |
          set -euo pipefail
          . packaging/ffmpeg.env
          curl -sSL --retry 3 -o ffmpeg-linux64.tar.xz "$FFMPEG_LINUX64_URL"
          echo "$FFMPEG_LINUX64_SHA256  ffmpeg-linux64.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          tar -xJf ffmpeg-linux64.tar.xz -C "$RUNNER_TEMP/ffmpeg"
          "$RUNNER_TEMP/ffmpeg/ffmpeg" -version | head -1
          echo "LOCALMEDIA_FFMPEG=$RUNNER_TEMP/ffmpeg/ffmpeg" >> "$GITHUB_ENV"
          echo "LOCALMEDIA_FFPROBE=$RUNNER_TEMP/ffmpeg/ffprobe" >> "$GITHUB_ENV"
          # With this set, a test that needs the converter fails instead of
          # being skipped when the converter is missing.
          echo "LM_REQUIRE_FFMPEG=1" >> "$GITHUB_ENV"
      - name: Go checks
        run: |
          go vet ./...
          go test ./...
      - name: The list of other people's code built into the program is up to date
        # (Runs also when a check above failed, so that the other systems
        # can still be tested with what was built: one failing test on
        # Linux must not hide what Windows and Safari's engine would say.
        # The job still ends as failed, and nothing is published.)
        if: ${{ !cancelled() }}
        run: |
          bash packaging/third-party-licenses.sh
          git diff --exit-code -- packaging/THIRD-PARTY-LICENSES.txt || { echo "Run: bash packaging/third-party-licenses.sh, and commit the result"; exit 1; }
      - name: Build every platform with cgo off
        if: ${{ !cancelled() }}
        run: make cross VERSION="$LM_VERSION"
      - name: End-to-end test in Chromium (keyboard only, plain HTTP)
        if: ${{ !cancelled() }}
        run: |
          cp release/localmedia-linux-amd64 localmedia
          cd e2e && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
          node run.mjs
      - name: Package for Windows with the pinned file inspector and converter
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          . packaging/ffmpeg.env
          curl -sSL --retry 3 -o ffmpeg-win64.zip "$FFMPEG_WIN64_URL"
          echo "$FFMPEG_WIN64_SHA256  ffmpeg-win64.zip" | sha256sum -c -
          mkdir -p package/LocalMedia
          unzip -q -j ffmpeg-win64.zip ffprobe.exe ffmpeg.exe -d package/LocalMedia
          # The packaged program has no console window: its sign of life is
          # the icon beside the clock.
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=${LM_VERSION}" -o package/LocalMedia/localmedia.exe ./cmd/localmedia
          cp LICENSE package/LocalMedia/LICENSE.txt
          cp packaging/THIRD-PARTY.txt package/LocalMedia/THIRD-PARTY.txt
          cp packaging/THIRD-PARTY-LICENSES.txt package/LocalMedia/THIRD-PARTY-LICENSES.txt
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: localmedia-builds
          path: release/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: LocalMedia-Windows
          path: package/
          retention-days: 30

  windows:
    needs: [plan, linux]
    # Runs whether or not the Linux job passed (it needs only what that job
    # built), so that every system reports on every push.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.all_os == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: LocalMedia-Windows
          path: package
      - name: Go tests on Windows, converting with the very ffmpeg.exe that is shipped
        shell: pwsh
        run: |
          $env:LOCALMEDIA_FFMPEG = (Resolve-Path "package\LocalMedia\ffmpeg.exe").Path
          $env:LOCALMEDIA_FFPROBE = (Resolve-Path "package\LocalMedia\ffprobe.exe").Path
          $env:LM_REQUIRE_FFMPEG = "1"
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw "tests failed" }
      - name: The Windows package starts, answers and has a working file inspector and converter
        # (Runs also when the tests above failed, so that one failing
        # test does not hide what this step would have found.)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $dir = "package\LocalMedia"
          foreach ($f in "localmedia.exe", "ffprobe.exe", "ffmpeg.exe", "LICENSE.txt", "THIRD-PARTY.txt", "THIRD-PARTY-LICENSES.txt") {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "the package lacks $f" }
          }
          $fver = & "$dir\ffmpeg.exe" -version | Out-String
          if ($LASTEXITCODE -ne 0 -or $fver -notmatch "ffmpeg version") { throw "the bundled ffmpeg does not run" }
          $ver = & "$dir\ffprobe.exe" -version | Out-String
          if ($LASTEXITCODE -ne 0 -or $ver -notmatch "ffprobe version") { throw "the bundled ffprobe does not run" }
          Write-Host ($ver -split "`n")[0]
          $json = & "$dir\ffprobe.exe" -v error -print_format json -show_streams "e2e\fixtures\Dolby.Sound.Test.mkv" | Out-String
          if ($json -notmatch '"codec_name": "ac3"') { throw "the bundled ffprobe did not read the test file" }
          $data = Join-Path $env:RUNNER_TEMP "lm-data"
          $out = Join-Path $env:RUNNER_TEMP "lm-out.txt"
          $p = Start-Process -FilePath "$dir\localmedia.exe" -ArgumentList "--data", $data, "--port", "18177", "--no-browser", "--no-update" -PassThru -RedirectStandardOutput $out
          $ok = $false
          foreach ($i in 1..50) {
            try {
              $r = Invoke-RestMethod -Uri "http://localhost:18177/health" -TimeoutSec 2
              if ($r.status -eq "ok") { $ok = $true; break }
            } catch { Start-Sleep -Milliseconds 200 }
          }
          if (-not $ok) { Stop-Process -Id $p.Id -Force; throw "the program did not answer" }
          $page = Invoke-WebRequest -Uri "http://localhost:18177/" -UseBasicParsing
          if ($page.Content -notmatch "Local Media") { throw "the web app is not inside the program" }
          $state = Invoke-RestMethod -Uri "http://localhost:18177/api/state"
          if ($state.setupDone) { throw "a fresh install claims to be set up" }
          Stop-Process -Id $p.Id -Force
          if ((Get-Content $out -Raw) -match "ffprobe was not found") { throw "the program did not find the ffprobe beside it" }
          if ((Get-Content $out -Raw) -match "ffmpeg was not found") { throw "the program did not find the ffmpeg beside it" }
          Write-Host "Windows program started, served the web app and answered. Version: $($r.version)"

      - name: Build the installer
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $ver = "${{ needs.plan.outputs.version }}" -replace '^v', ''
          if ($ver -notmatch '^\d+\.\d+\.\d+$') { $ver = "0.0.0" }
          & $iscc "/DAppVersion=$ver" "packaging\installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "the installer did not build" }
          Get-Item installer\LocalMedia-Setup.exe | Format-List Name, Length
      - name: Install, start, and uninstall on a real Windows machine
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $app = Join-Path $env:LOCALAPPDATA "Programs\LocalMedia"
          $data = Join-Path $env:LOCALAPPDATA "localmedia"
          $run = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          function Rule { (netsh advfirewall firewall show rule name="Local Media" | Out-String) -match "Local Media" }

          # What an owner who used the loose program has: a data folder.
          New-Item -ItemType Directory -Force $data | Out-Null
          Set-Content (Join-Path $data "kept-from-before.txt") "watch history stands in here"

          $i = Start-Process installer\LocalMedia-Setup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/TASKS=autostart,firewall" -Wait -PassThru
          if ($i.ExitCode -ne 0) { throw "the installer failed with $($i.ExitCode)" }
          foreach ($f in "localmedia.exe", "ffprobe.exe", "ffmpeg.exe", "LICENSE.txt", "THIRD-PARTY.txt", "THIRD-PARTY-LICENSES.txt", "unins000.exe") {
            if (-not (Test-Path (Join-Path $app $f))) { throw "after installing, $f is missing" }
          }
          if (-not (Rule)) { throw "the firewall rule was not added" }
          $auto = (Get-ItemProperty $run).LocalMedia
          if ($auto -notmatch "localmedia.exe") { throw "start with Windows was not set: $auto" }
          if (-not (Test-Path (Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Local Media.lnk"))) { throw "no Start menu entry" }

          # Start it the way Windows would at sign-in: with the icon beside the clock.
          $p = Start-Process (Join-Path $app "localmedia.exe") -ArgumentList "--no-browser", "--no-update", "--port", "18178" -PassThru
          $ok = $false
          foreach ($n in 1..50) {
            try { if ((Invoke-RestMethod "http://localhost:18178/health" -TimeoutSec 2).status -eq "ok") { $ok = $true; break } } catch { Start-Sleep -Milliseconds 200 }
          }
          if (-not $ok) { throw "the installed program did not answer" }
          if ($p.HasExited) { throw "the installed program stopped by itself" }
          if (-not (Test-Path (Join-Path $data "localmedia.db"))) { throw "the installed program did not use the existing data folder" }

          # Installing again over a running copy (what a manual update is).
          $i = Start-Process installer\LocalMedia-Setup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/TASKS=autostart,firewall" -Wait -PassThru
          if ($i.ExitCode -ne 0) { throw "installing over a running copy failed with $($i.ExitCode)" }
          if (-not (Test-Path (Join-Path $data "kept-from-before.txt"))) { throw "installing again touched the data folder" }

          $u = Start-Process (Join-Path $app "unins000.exe") -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          Start-Sleep -Seconds 2
          if (Test-Path (Join-Path $app "localmedia.exe")) { throw "uninstalling left the program behind" }
          if (Rule) { throw "uninstalling left the firewall rule behind" }
          if ((Get-ItemProperty $run -ErrorAction SilentlyContinue).LocalMedia) { throw "uninstalling left start-with-Windows behind" }
          if (-not (Test-Path (Join-Path $data "kept-from-before.txt")) -or -not (Test-Path (Join-Path $data "localmedia.db"))) { throw "uninstalling removed the owner's data" }
          Write-Host "Installed, started, installed again over a running copy, and uninstalled. The data folder was never touched."
          # "Rule not found" is the answer wanted above, but netsh reports it
          # as an error code, which would otherwise fail this step.
          exit 0
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: LocalMedia-Setup
          path: installer/LocalMedia-Setup.exe
          retention-days: 30

  macos:
    needs: [plan, linux]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.all_os == 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch the pinned converter for macOS
        run: |
          set -euo pipefail
          . packaging/ffmpeg.env
          curl -sSL --retry 3 -o ffmpeg-mac.tar.xz "$FFMPEG_MACARM64_URL"
          echo "$FFMPEG_MACARM64_SHA256  ffmpeg-mac.tar.xz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          tar -xJf ffmpeg-mac.tar.xz -C "$RUNNER_TEMP/ffmpeg"
          "$RUNNER_TEMP/ffmpeg/ffmpeg" -version | head -1
          echo "LOCALMEDIA_FFMPEG=$RUNNER_TEMP/ffmpeg/ffmpeg" >> "$GITHUB_ENV"
          echo "LOCALMEDIA_FFPROBE=$RUNNER_TEMP/ffmpeg/ffprobe" >> "$GITHUB_ENV"
          echo "LM_REQUIRE_FFMPEG=1" >> "$GITHUB_ENV"
      - name: Go tests on macOS
        run: go test ./...
      - uses: actions/download-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: localmedia-builds
          path: release
      - name: End-to-end test in Safari's engine (the owner's phone is an iPhone)
        # (Runs also when the tests above failed, so that one failing
        # test does not hide what this step would have found.)
        if: ${{ !cancelled() }}
        run: |
          cp release/localmedia-darwin-arm64 localmedia && chmod +x localmedia
          cd e2e && npm ci --no-audit --no-fund && npx playwright install webkit
          E2E_BROWSER=webkit node run.mjs

  linux-arm:
    needs: [plan, linux]
    # ARM machines are only offered free to public repositories.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.public == 'true' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go tests on ARM Linux
        run: go test ./...

  release:
    needs: [plan, linux, windows, macos]
    # Only when every system passed. (The other jobs now run even after a
    # failure on Linux, so this is said outright and not left to the rule
    # that a job is skipped when one it needs failed.)
    if: ${{ needs.plan.outputs.release != '' && needs.linux.result == 'success' && needs.windows.result == 'success' && needs.macos.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.plan.outputs.release }}
      SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: Refuse a commit that is marked as not for release
        run: |
          if [ -f packaging/NOT-FOR-RELEASE.txt ]; then
            cat packaging/NOT-FOR-RELEASE.txt
            exit 1
          fi
          test -f "docs/release-notes/$TAG.md" || { echo "docs/release-notes/$TAG.md is missing: write the release notes first"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: localmedia-builds
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: LocalMedia-Windows
          path: package
      - uses: actions/download-artifact@v4
        with:
          name: LocalMedia-Setup
          path: release
      - name: Package and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          for f in localmedia-*; do
            case "$f" in
              *.exe) base="${f%.exe}"; mkdir -p "pkg/$base"; cp "$f" "pkg/$base/localmedia.exe" ;;
              *)     base="$f";        mkdir -p "pkg/$base"; cp "$f" "pkg/$base/localmedia"; chmod +x "pkg/$base/localmedia" ;;
            esac
            cp ../LICENSE "pkg/$base/LICENSE.txt"
            cp ../packaging/THIRD-PARTY-LICENSES.txt "pkg/$base/THIRD-PARTY-LICENSES.txt"
            (cd pkg && zip -q -r "../$base.zip" "$base")
          done
          rm -f localmedia-windows-amd64.zip
          (cd ../package && zip -q -r ../release/LocalMedia-Windows.zip LocalMedia)
          sha256sum *.zip LocalMedia-Setup.exe > SHA256SUMS.txt
          notes=../docs/release-notes/"$TAG".md
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # The release was made by hand on GitHub's page, which also made
            # the tag that started this run: give it its files and its notes.
            gh release upload "$TAG" *.zip LocalMedia-Setup.exe SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Local Media $TAG" --notes-file "$notes"
          else
            # Where the tag does not exist yet, this makes it, on the commit
            # that was just tested.
            gh release create "$TAG" *.zip LocalMedia-Setup.exe SHA256SUMS.txt --target "$SHA" \
              --repo "$GITHUB_REPOSITORY" --title "Local Media $TAG" --notes-file "$notes"
          fi
